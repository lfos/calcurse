name: Build and test

on:
  push:
    branches: [master, pu]
    paths-ignore:
    - 'contrib/**'
    - 'doc/**'
    - 'po/**'
  pull_request:
    branches: [master, pu]
    paths-ignore:
    - 'contrib/**'
    - 'doc/**'
    - 'po/**'

jobs:
  build:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install asciidoc autopoint gettext xmlto
      if: matrix.os == 'ubuntu-latest'
    - name: Install dependencies (macOS)
      run: |
        brew install --overwrite python
        brew update
        brew install automake
        brew install asciidoc
        brew install gettext
        brew install xmlto
        brew link --force gettext
        sudo mkdir /etc/xml
        sudo ln -s /usr/local/etc/xml/catalog /etc/xml/catalog
      if: matrix.os == 'macos-latest'
    - name: autogen.sh
      run: ./autogen.sh
    - name: configure (Ubuntu)
      run: ./configure
      if: matrix.os == 'ubuntu-latest'
    - name: configure (macOS)
      # TODO: Fix documentation build step under macOS and remove
      # --disable-docs below.
      run: ./configure --disable-docs
      if: matrix.os == 'macos-latest'
    - name: make
      run: make
    - name: make check
      run: make check
      env:
        # Print the logs of failed tests.
        VERBOSE: 1
    - name: make distcheck
      # TODO: Run `make distcheck` on all OS once the documentation build issue
      # on macOS has been fixed.
      run: make distcheck
      env:
        VERBOSE: 1
      if: matrix.os == 'ubuntu-latest'

  bsd:
    strategy:
      matrix:
        os: ['freebsd', 'openbsd']
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Create release tarball
      run: |
        sudo apt-get update
        sudo apt-get install asciidoc autopoint gettext xmlto
        ./autogen.sh
        ./configure
        make dist
    - name: Build and test release tarball (FreeBSD)
      uses: vmactions/freebsd-vm@v1
      with:
        prepare: pkg install -y gettext-runtime
        run: |
          tar xzf calcurse-*.tar.gz
          cd calcurse-*/
          ./configure
          make
          VERBOSE=1 make check
      if: matrix.os == 'freebsd'
    - name: Build and test release tarball (OpenBSD)
      uses: vmactions/openbsd-vm@v1
      with:
        prepare: pkg_add gettext-runtime
        run: |
          tar xzf calcurse-*.tar.gz
          cd calcurse-*/
          ./configure
          make
          VERBOSE=1 make check
      if: matrix.os == 'openbsd'
